name: Build & Release

# Any pushed tag is treated as a version: the tag (minus a leading "v")
# names the release and the EXE, e.g. tag v1.2.3 -> WordFellow-1.2.3.exe
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Get version from tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build single-file EXE
        shell: pwsh
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon=assets/icon.ico
          --name WordFellow-${{ steps.ver.outputs.version }}
          --add-data "frontend;frontend"
          --add-data "1212_Category;1212_Category"
          main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordFellow-${{ steps.ver.outputs.version }}
          path: dist/WordFellow-${{ steps.ver.outputs.version }}.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WordFellow-${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true
